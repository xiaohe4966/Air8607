<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940">
  <defs>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#8b9bb4"/>
    </marker>
  </defs>

  <rect width="1400" height="940" fill="#07111f"/>

  <text x="60" y="66" fill="#e6eefc" font-size="34" font-weight="700"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">Air8607（Air1603）↔ ESP32-C3 接线图</text>
  <text x="60" y="102" fill="#7f98b8" font-size="19"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">UART2 · 115200 8N1 · 3.3 V 逻辑 · 只需要 3 根线</text>

  <!-- ================= Air8607 card ================= -->
  <rect x="60" y="140" width="430" height="540" rx="16" fill="#0f1e31" stroke="#203550" stroke-width="2"/>
  <text x="88" y="182" fill="#e6eefc" font-size="24" font-weight="700"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">Air8607 板</text>
  <text x="88" y="210" fill="#7f98b8" font-size="16"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">J110 · 1×8 2.54 mm 排针</text>

  <rect x="392" y="232" width="26" height="300" rx="4" fill="#16273d" stroke="#3a5a80" stroke-width="2"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="18">
    <line x1="330" y1="250" x2="392" y2="250" stroke="#3a5a80" stroke-width="3"/>
    <text x="322" y="257" fill="#8b9bb4" text-anchor="end">1  RX1</text>

    <line x1="330" y1="284" x2="392" y2="284" stroke="#3a5a80" stroke-width="3"/>
    <text x="322" y="291" fill="#8b9bb4" text-anchor="end">2  TX1</text>

    <line x1="330" y1="318" x2="392" y2="318" stroke="#8b9bb4" stroke-width="4"/>
    <text x="322" y="325" fill="#cbd8ea" text-anchor="end" font-weight="700">3  GND</text>

    <line x1="330" y1="352" x2="392" y2="352" stroke="#3a5a80" stroke-width="3"/>
    <text x="322" y="359" fill="#8b9bb4" text-anchor="end">4  VBAT</text>

    <line x1="330" y1="392" x2="392" y2="392" stroke="#f59e0b" stroke-width="5"/>
    <text x="322" y="399" fill="#f59e0b" text-anchor="end" font-weight="700">5  RX2</text>

    <line x1="330" y1="432" x2="392" y2="432" stroke="#22d3ee" stroke-width="5"/>
    <text x="322" y="439" fill="#22d3ee" text-anchor="end" font-weight="700">6  TX2</text>

    <line x1="330" y1="466" x2="392" y2="466" stroke="#8b9bb4" stroke-width="4"/>
    <text x="322" y="473" fill="#cbd8ea" text-anchor="end" font-weight="700">7  GND</text>

    <line x1="330" y1="500" x2="392" y2="500" stroke="#3a5a80" stroke-width="3"/>
    <text x="322" y="507" fill="#8b9bb4" text-anchor="end">8  VDD_EXT</text>
  </g>

  <g font-size="15" fill="#7f98b8"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="88" y="560">① 用丝印找针脚：RX2 / TX2 / GND</text>
    <text x="88" y="588">② 若从另一端数，RX2/TX2 是第 5/6 个</text>
    <text x="88" y="616">③ GND 用 pin 3 或 pin 7 任一个</text>
    <text x="88" y="644" fill="#e06c75" font-weight="700">④ pin 4 VBAT / pin 8 VDD_EXT 别乱接</text>
  </g>

  <!-- ================= ESP32-C3 card ================= -->
  <rect x="910" y="140" width="430" height="540" rx="16" fill="#0f1e31" stroke="#203550" stroke-width="2"/>
  <text x="938" y="182" fill="#e6eefc" font-size="24" font-weight="700"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">ESP32-C3 板</text>
  <text x="938" y="210" fill="#7f98b8" font-size="16"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">用 GPIO4 / GPIO5，别用 USB 口的 TX/RX</text>

  <rect x="1310" y="232" width="26" height="300" rx="4" fill="#16273d" stroke="#3a5a80" stroke-width="2"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="18">
    <line x1="1150" y1="280" x2="1310" y2="280" stroke="#f59e0b" stroke-width="5"/>
    <text x="1138" y="268" fill="#f59e0b" text-anchor="end" font-weight="700">GPIO4 · UART1_TX（发送）</text>

    <line x1="1150" y1="380" x2="1310" y2="380" stroke="#22d3ee" stroke-width="5"/>
    <text x="1138" y="368" fill="#22d3ee" text-anchor="end" font-weight="700">GPIO5 · UART1_RX（接收）</text>

    <line x1="1150" y1="460" x2="1310" y2="460" stroke="#8b9bb4" stroke-width="4"/>
    <text x="1138" y="448" fill="#cbd8ea" text-anchor="end" font-weight="700">GND</text>

    <line x1="1150" y1="510" x2="1310" y2="510" stroke="#3a5a80" stroke-width="3"/>
    <text x="1138" y="498" fill="#8b9bb4" text-anchor="end">3V3（仅供电参考）</text>
  </g>

  <g font-size="15" fill="#7f98b8"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="938" y="560">① GPIO4/GPIO5 就是排针上的 4 / 5 脚</text>
    <text x="938" y="588">② USB 口的 TX/RX 是 UART0 调试口</text>
    <text x="938" y="616">③ 供电：USB 或独立 3.3 V/5 V</text>
    <text x="938" y="644" fill="#e06c75" font-weight="700">④ 不要从 VDD_EXT 取电（带不动 WiFi）</text>
  </g>

  <!-- ================= wires (straight, schematic style) ================= -->
  <line x1="1150" y1="280" x2="396" y2="392" stroke="#f59e0b" stroke-width="5" marker-end="url(#aOrange)"/>
  <line x1="396" y1="432" x2="1150" y2="380" stroke="#22d3ee" stroke-width="5" marker-end="url(#aCyan)"/>
  <line x1="396" y1="466" x2="1150" y2="460" stroke="#8b9bb4" stroke-width="4" marker-end="url(#aGray)"/>

  <rect x="560" y="286" width="300" height="32" rx="8" fill="#0b1727" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="710" y="308" fill="#f59e0b" font-size="16" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">GPIO4 TX → RX2（数据进 Air8607）</text>

  <rect x="560" y="424" width="300" height="32" rx="8" fill="#0b1727" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="710" y="446" fill="#22d3ee" font-size="16" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">TX2 → GPIO5 RX（数据进 C3）</text>

  <rect x="700" y="488" width="230" height="32" rx="8" fill="#0b1727" stroke="#8b9bb4" stroke-width="1.5"/>
  <text x="815" y="510" fill="#cbd8ea" font-size="16" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">GND ↔ GND（必须共地）</text>

  <!-- ================= notes ================= -->
  <rect x="60" y="706" width="1280" height="196" rx="14" fill="#101b2b" stroke="#2a4562" stroke-width="2"/>
  <text x="88" y="744" fill="#f59e0b" font-size="21" font-weight="700"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">注意事项</text>
  <g font-size="16" fill="#cbd8ea"
     font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">
    <text x="88" y="782">• TX/RX 必须交叉：C3 的 TX 接 Air8607 的 RX，C3 的 RX 接 Air8607 的 TX。</text>
    <text x="88" y="812">• 必须共地：没有 GND 线时串口会随机丢字节、时序全乱。</text>
    <text x="88" y="842">• 两边都是 3.3 V 逻辑，不要接 5 V，也不要加电平转换。</text>
    <text x="700" y="782">• C3 用 USB 或独立电源供电；VDD_EXT 只是接口上拉/辅助电源，带不动 WiFi 峰值电流。</text>
    <text x="700" y="812">• VBAT（pin 4）是 3.3–4.35 V 电池输入，不要拿来给 C3 供电。</text>
    <text x="700" y="842">• ESP32-C3 只支持 2.4 GHz WiFi，配网请选 2.4 GHz 的 SSID。</text>
  </g>
  <text x="88" y="882" fill="#7f98b8" font-size="15"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Helvetica,Arial,sans-serif">固件参数：UART1 = GPIO4(TX)/GPIO5(RX)，115200 8N1；Air8607 侧 uart.setup(2, 115200, 8, 1) 即 J110 的 RX2/TX2。</text>
</svg>
